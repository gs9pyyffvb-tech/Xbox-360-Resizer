name: Build Xbox 360 XEX

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "src/**"
      - "scripts/**"
      - "third_party/**"
      - "config.ini"
      - "build.sh"
      - ".github/workflows/build-xex.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Restore script permissions
        run: chmod +x build.sh scripts/*.sh

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang lld llvm binutils cmake ninja-build make git \
            python3 python3-yaml bzip2 gzip unzip zip gawk curl zlib1g-dev

      - name: Restore OpenXeChain
        id: restore-openxechain
        uses: actions/cache/restore@v4
        with:
          path: .openxechain/sysroot
          key: openxechain-complete-ubuntu24-${{ runner.arch }}-v3
          restore-keys: |
            openxechain-partial-ubuntu24-${{ runner.arch }}-v3-

      - name: Build OpenXeChain
        id: build-openxechain
        if: steps.restore-openxechain.outputs.cache-hit != 'true'
        continue-on-error: true
        run: scripts/build-toolchain.sh

      - name: Show OpenXeChain failure log
        if: steps.build-openxechain.outcome == 'failure'
        run: |
          echo "===== OpenXeChain build.log ====="
          if [ -f .openxechain/buildscript/build.log ]; then
            tail -n 1000 .openxechain/buildscript/build.log
          else
            echo "build.log not found"
          fi

      - name: Upload OpenXeChain failure log
        if: steps.build-openxechain.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: OpenXeChain-build-log
          path: .openxechain/buildscript/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Save partial OpenXeChain
        if: steps.build-openxechain.outcome == 'failure'
        uses: actions/cache/save@v4
        with:
          path: .openxechain/sysroot
          key: openxechain-partial-ubuntu24-${{ runner.arch }}-v3-${{ github.run_id }}

      - name: Stop after OpenXeChain failure
        if: steps.build-openxechain.outcome == 'failure'
        run: exit 1

      - name: Save completed OpenXeChain
        if: >
          steps.restore-openxechain.outputs.cache-hit != 'true' &&
          steps.build-openxechain.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .openxechain/sysroot
          key: openxechain-complete-ubuntu24-${{ runner.arch }}-v3

      - name: Fetch stb image libraries
        run: scripts/fetch-stb.sh

      - name: Build XEX
        env:
          OPENXECHAIN: ${{ github.workspace }}/.openxechain/sysroot
        run: ./build.sh

      - name: Package Aurora folder
        run: |
          mkdir -p dist/AuroraImageResizer
          cp build/default.xex dist/AuroraImageResizer/default.xex
          cp config.ini dist/AuroraImageResizer/config.ini
          cp README.md dist/AuroraImageResizer/README.txt
          cd dist
          zip -r AuroraImageResizer.zip AuroraImageResizer

      - name: Upload XEX artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuroraImageResizer
          path: |
            build/default.xex
            build/config.ini
            dist/AuroraImageResizer.zip
          if-no-files-found: error
